name: Publish

# Runs when a GitHub release is published. Uses npm trusted publishing (OIDC):
# no npm token is stored anywhere, and every version gets a provenance attestation.
# One-time setup: npmjs.com → package settings → Trusted publishing → add this repo + workflow.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
